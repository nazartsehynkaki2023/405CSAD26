name: Python CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Windows CI script
        if: runner.os == 'Windows'
        shell: cmd
        run: cmd /c ci.bat
      - name: Run POSIX CI script
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./ci.sh
      - name: Upload project and run instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-project-${{ matrix.os }}
          path: |
            src/
            tests/
            requirements-dev.txt
            ci.bat
            ci.sh
            README.md
            docs/usage.md
